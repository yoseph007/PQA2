[project]
name = "vmaf-test-app"
version = "1.0.1-alpha.1"
description = "VMAF Video Quality Analysis Application"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RET",   # flake8-return
    "PIE",   # flake8-pie
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B905",  # zip-without-explicit-strict (not needed for this project)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM300"]  # Allow assert True and yoda conditions in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false  # Start lenient; tighten in Phase 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]
