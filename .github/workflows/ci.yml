name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit & Regression Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache FFmpeg Binaries
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ffmpeg_bin
          key: ffmpeg-btbn-win64-master-v1

      - name: Install FFmpeg (BtbN static build with libvmaf)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ffmpeg_bin"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
          Get-ChildItem -Path "ffmpeg_extracted/*/bin/*" | Copy-Item -Destination "ffmpeg_bin/" -Force
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_extracted"

      - name: Verify FFmpeg Installation
        shell: pwsh
        run: |
          ./ffmpeg_bin/ffmpeg.exe -version

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python run_tests.py --verbose

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: logs/
          if-no-files-found: ignore
